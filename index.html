        /* ═══════════════════════════════════════════════
           LAYOUT
           ═══════════════════════════════════════════════ */

        body {
            font-family: 'Georgia', serif;
            color: var(--text);
            min-height: 100svh;
        }

        site-container {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100svh;
        }

        /* Header */
        header {
            padding-bottom: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            & h1 {
                font-size: 2rem;
                margin-bottom: 4px;
            }
            & .subtitle {
                font-style: italic;
                opacity: 0.7;
                font-size: 0.9rem;
                margin-top: 8px;
            }
        }

        nav {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            & a {
                color: var(--accent);
                text-decoration: none;
                font-size: 0.95rem;
                &:visited { color: var(--accent); }
                &:hover { text-decoration: underline; }
            }
        }

        /* Blog entries */
        blog-feed {
            display: block;
        }

        blog-entry {
            display: block;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 24px;
            margin-bottom: 30px;

    <!-- Progressive enhancement: persistence + party pop -->
    <script>
        const themeSelect = document.getElementById('theme-select');
        const saved = localStorage.getItem('rc-theme');
        if (saved) { const opt = document.getElementById(saved); if (opt) opt.selected = true; }
        themeSelect.addEventListener('change', () => {
            const sel = themeSelect.selectedOptions[0];
            if (sel) localStorage.setItem('rc-theme', sel.id);
        });

        // Ponk party pop
        let audioCtx = null;
        function playPartyPop() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const ctx = audioCtx, now = ctx.currentTime;

            // Noise burst (the "pop")
            const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
            const noiseData = noiseBuf.getChannelData(0);
            for (let i = 0; i < noiseData.length; i++) noiseData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / noiseData.length, 3);
            const noiseSrc = ctx.createBufferSource(); noiseSrc.buffer = noiseBuf;
            const noiseGain = ctx.createGain(); noiseGain.gain.setValueAtTime(0.4, now); noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            const noiseFilter = ctx.createBiquadFilter(); noiseFilter.type = 'bandpass'; noiseFilter.frequency.value = 2000; noiseFilter.Q.value = 0.8;
            noiseSrc.connect(noiseFilter).connect(noiseGain).connect(ctx.destination); noiseSrc.start(now); noiseSrc.stop(now + 0.08);

            // Descending chirp (the "wheee")
            const osc = ctx.createOscillator(); osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
            const chirpGain = ctx.createGain(); chirpGain.gain.setValueAtTime(0.2, now); chirpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(chirpGain).connect(ctx.destination); osc.start(now); osc.stop(now + 0.2);
        }

        let prevPonk = themeSelect.value === 'ponk';
        themeSelect.addEventListener('change', () => {
            const nowPonk = themeSelect.value === 'ponk';
            if (nowPonk && !prevPonk) playPartyPop();
            prevPonk = nowPonk;
        });
        if (prevPonk) document.addEventListener('click', () => playPartyPop(), { once: true });
    </script>
